# docker compose for local launch, render.com launches production service using only Dockerfile and its own configuration
name: finfast

services:
  db:
    image: postgres:18
    container_name: finfast-db
    environment:
      POSTGRES_DB: finfast
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "5432:5432"
  backend:
    build:
      context: .
      dockerfile: Dockerfile.native
    env_file:
      - .env.dev
    container_name: finfast-backend-native
    ports:
      - "8081:8081"


volumes:
  postgres-data: