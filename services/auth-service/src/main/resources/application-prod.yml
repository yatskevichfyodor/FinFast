quarkus:
  http:
    port: ${PORT}
    cors:
      origins: ${CLIENT_URL}

  datasource:
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    jdbc:
      url: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}

logging:
  level:
    root: INFO
    org.example.finfast: WARN
    org.springframework.security: WARN

finfast:
  jwt:
    private-key-b64: ${FINFAST_JWT_PRIVATE_KEY_B64}
    public-key-b64: ${FINFAST_JWT_PUBLIC_KEY_B64}
  google:
    client-id: ${GOOGLE_CLIENT_ID}