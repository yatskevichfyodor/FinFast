quarkus:
  application:
    name: auth-service
  package:
    output-name: auth-service

  http:
    cors:
      enabled: true
      methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      headers: Content-Type,Authorization

  datasource:
    db-kind: postgresql

  hibernate-orm:
    schema-management:
      strategy: validate

  flyway:
    migrate-at-start: true
    table: auth_flyway_schema_history

kafka:
  sasl:
    mechanism: PLAIN
  devservices:
    enabled: false

mp:
  messaging:
    outgoing:
      user-events-out:
        connector: smallrye-kafka
        topic: user-events
        value:
          serializer: org.apache.kafka.common.serialization.StringSerializer

finfast:
  jwt:
    issuer: finfast-api
    access-token-lifetime-seconds: 900 # 15 minutes
    key-ttl-minutes: 1440 # 24 hours for old key retention
    rotation-interval: 7d # 7 days for key rotation
  outbox:
    max-attempts: 5
