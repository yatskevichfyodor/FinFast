# docker compose for local launch, render.com launches production service using only Dockerfile and its own configuration
name: finfast-jvm

services:

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: finfast
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "5432:5432"

  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT,
        INTERNAL:SASL_PLAINTEXT,
        EXTERNAL:SASL_PLAINTEXT

      KAFKA_LISTENERS: >-
        CONTROLLER://:9093,
        INTERNAL://:9092,
        EXTERNAL://:9094

      KAFKA_ADVERTISED_LISTENERS: >-
        INTERNAL://kafka:9092,
        EXTERNAL://localhost:9094

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_LISTENER_NAME_INTERNAL_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_LISTENER_NAME_EXTERNAL_SASL_ENABLED_MECHANISMS: PLAIN

      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN

      KAFKA_OPTS: >-
        -Djava.security.auth.login.config=/etc/kafka/kafka_server_jaas.conf

    volumes:
      - ./kafka/kafka_server_jaas.conf:/etc/kafka/kafka_server_jaas.conf:ro

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      - kafka
    volumes:
      - ./kafka/kafka_client.properties:/etc/kafka/kafka_client.properties:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Kafka..."
        until /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --command-config /etc/kafka/kafka_client.properties \
          --list >/dev/null 2>&1; do
          sleep 2
        done

        echo "Creating topic user-events..."
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --command-config /etc/kafka/kafka_client.properties \
          --create \
          --if-not-exists \
          --topic user-events \
          --partitions 1 \
          --replication-factor 1

        echo "Kafka topic user-events is ready."

  auth-service:
    build:
      context: ../services/auth-service
      dockerfile: Dockerfile
    env_file:
      - .env.dev
    ports:
      - "8082:8082"
    depends_on:
      - db
      - kafka

  expense-service:
    build:
      context: ../services/expense-service
      dockerfile: Dockerfile
    env_file:
      - .env.dev
    ports:
      - "8081:8081"
    depends_on:
      - db
      - kafka

volumes:
  postgres-data:
    external: true
    name: finfast_postgres-data