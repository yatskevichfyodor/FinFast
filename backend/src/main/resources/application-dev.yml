server:
  port: 8081

spring:
  datasource:
    # DATABASE_HOST will be postgres for local launch in docker container
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:5432/finfast
    username: postgres
    password: postgres

logging:
  level:
    root: INFO
    org.example.finfast: DEBUG
    org.springframework.security: DEBUG

finfast:
  jwt:
    private-key-b64: 
    public-key-b64: 
  clientUrl: http://localhost:5173
