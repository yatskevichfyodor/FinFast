# docker compose for local launch, render.com launches production service using only Dockerfile and its own configuration
services:
  db:
    image: postgres:18
    container_name: finfast-db
    environment:
      POSTGRES_DB: finfast
      POSTGRES_USER: finfast
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
       - "5432:5432"
  backend:
    build: .
    env_file:
      - .env.dev
    container_name: finfast-backend
    ports:
      - "8081:8081"


volumes:
  postgres-data: