name: Build Native Images and Deploy

on:
  push:
    branches:
      - production

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Auth Service
      - name: Build and push auth-service
        uses: docker/build-push-action@v6
        with:
          context: ./services/auth-service
          file: ./services/auth-service/Dockerfile.native
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/finfast-auth:latest
            ghcr.io/${{ github.repository_owner }}/finfast-auth:${{ github.sha }}

      # Expense Service
      - name: Build and push expense-service
        uses: docker/build-push-action@v6
        with:
          context: ./services/expense-service
          file: ./services/expense-service/Dockerfile.native
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/finfast-expense:latest
            ghcr.io/${{ github.repository_owner }}/finfast-expense:${{ github.sha }}

      # Deploy Auth Service
      - name: Deploy auth-service to Render
        run: curl -X POST "${{ secrets.AUTH_SERVICE_DEPLOY_HOOK_URL }}"

      # Deploy Expense Service
      - name: Deploy expense-service to Render
        run: curl -X POST "${{ secrets.EXPENSE_SERVICE_DEPLOY_HOOK_URL }}"