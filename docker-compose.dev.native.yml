# docker compose for local launch, render.com launches production service using only Dockerfile and its own configuration
name: finfast

services:

  db:
    image: postgres:18
    container_name: finfast-db
    environment:
      POSTGRES_DB: finfast
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "5432:5432"

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile.native
      args:
        QUARKUS_PROFILE: dev
    container_name: finfast-auth
    env_file:
      - .env.dev
    ports:
      - "8082:8082"
    depends_on:
      - db

  expense-service:
    build:
      context: ./services/expense-service
      dockerfile: Dockerfile.native
    container_name: finfast-expense
    env_file:
      - .env.dev
    ports:
      - "8081:8081"
    depends_on:
      - db

volumes:
  postgres-data: